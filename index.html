<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>澎湖智慧飲食</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🌊 澎湖智慧飲食</h1>
        <p>探索澎湖食材、海鮮、營養與特色飲食</p>
    </header>

    <nav>
        <a href="#">首頁</a>
        <a href="#">澎湖食材</a>
        <a href="#">澎湖水產</a>
        <a href="#">四季食材</a>
        <a href="#">營養分析</a>
        <a href="#">食譜</a>
        <a href="#">AI 飲食推薦</a>
    </nav>

    <main>

        <section class="welcome">
            <h2>認識澎湖的食材</h2>

            <p>
                本網站整理澎湖在地蔬菜、水果、水產、
                肉類、乾貨及醃漬食品，
                並提供季節、產地、營養與料理資訊。
            </p>

            <button onclick="showMessage()">
                開始探索
            </button>
        </section>

        <section>

            <h2>食材分類</h2>

            <div class="categories">

                <div class="card">
                    <h3>🥬 蔬菜</h3>
                    <p>菱角絲瓜、南瓜、青江菜、番茄等</p>
                </div>

                <div class="card">
                    <h3>🍉 水果</h3>
                    <p>嘉寶瓜、洋香瓜、紅龍果、芒果等</p>
                </div>

                <div class="card">
                    <h3>🐟 水產</h3>
                    <p>午仔魚、小卷、透抽、石斑等</p>
                </div>

                <div class="card">
                    <h3>🦐 蝦蟹貝類</h3>
                    <p>明蝦、火燒蝦、牡蠣、文蛤等</p>
                </div>

            </div>

        </section>

    </main>

    <footer>
        <p>澎湖智慧飲食 © 2026</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
